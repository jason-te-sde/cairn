name: Idea
description: Something this should do and does not
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `docs/design/0005-scope.md` lists what is deliberately absent and why. If the idea is on
        that list, the useful thing to argue with is the reasoning there rather than the omission.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what stopped you
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would do about it
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: What it would cost
      description: >
        Every addition costs something. A clock assumption, a dependency, a rule the simulator
        cannot check, a guarantee that becomes conditional. Naming it makes the conversation short.
