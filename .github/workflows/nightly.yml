name: Nightly

on:
  schedule:
    # 04:00 UTC. Late enough that a failure is waiting in the morning rather than at three.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many simulation seeds to sweep'
        required: false
        default: '5000'

permissions:
  contents: read

jobs:
  soak:
    name: simulation soak
    runs-on: ubuntu-latest
    # A wide sweep is the point, so the timeout is generous. Five thousand seeds is about four
    # minutes at the throughput the README quotes; the headroom is for a runner having a bad day.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp install -DskipTests -q
      - name: sweep
        run: |
          mvn -B -ntp test -pl cairn-testkit -am -Dtest=SoakTest \
              -Dcairn.sim.seeds=${{ github.event.inputs.seeds || '5000' }} \
              -Dsurefire.failIfNoSpecifiedTests=false
      - name: differential sweep
        run: |
          mvn -B -ntp test -pl cairn-testkit -am -Dtest=DifferentialKernelTest \
              -Dsurefire.failIfNoSpecifiedTests=false
      # The seed is in the failure message and the run is a function of it, so the report is enough
      # to reproduce the failure locally. Keeping it is the difference between a reproducible bug
      # and a note that something went wrong overnight.
      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-nightly
          path: '**/target/surefire-reports/**'
          retention-days: 30

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp install -DskipTests -q
      # Recorded rather than asserted on. A shared runner's disk is not a basis for a threshold,
      # and a benchmark that fails the build on a noisy neighbour is a benchmark somebody disables.
      # The numbers in the README are measured on known hardware and say so.
      - name: log, kernel, codec and simulation throughput
        run: |
          mvn -B -ntp test -Dcairn.bench=true \
              -Dtest='LogThroughputTest,ThroughputTest,KernelScalingTest' \
              -Dsurefire.failIfNoSpecifiedTests=false | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.txt
          retention-days: 90

  demo:
    name: the README transcript still reproduces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp package -DskipTests -q
      # The README's transcript is generated by this script, so a change that breaks it breaks
      # here instead of leaving a README that quietly describes a different program.
      - run: ./scripts/demo.sh
