name: Javadoc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # One aggregate site over every module, so a type in another module is already on the same
      # page and needs no cross-build link. doclint is on for references and HTML and off for
      # missing tags: failing a build because a package-private helper lacks an @param would make
      # the check something to disable rather than something to satisfy.
      - name: aggregate javadoc
        run: |
          mvn -B -ntp install -DskipTests -q
          mvn -B -ntp javadoc:aggregate -Prelease
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
